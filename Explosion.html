<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACCESS GRANTED</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                linear-gradient(rgba(0,255,255,0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,255,0.035) 1px, transparent 1px),
                #030609;
            background-size: 40px 40px;
            color: #00ffff;
            font-family: "Consolas", "Courier New", monospace;
            overflow: hidden;
        }

        /* スキャンライン */

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(255,255,255,0.015),
                rgba(255,255,255,0.015) 1px,
                transparent 1px,
                transparent 4px
            );
        }

        /* メインパネル */

        .container {
            width: min(90%, 650px);
            padding: 55px 40px;
            text-align: center;
            background: rgba(3,15,18,0.94);
            border: 1px solid #00ff88;
            box-shadow:
                0 0 10px #00ff88,
                0 0 40px rgba(0,255,136,0.15),
                inset 0 0 40px rgba(0,255,136,0.05);
            position: relative;
        }

        /* コーナー装飾 */

        .container::before,
        .container::after {
            content: "";
            position: absolute;
            width: 35px;
            height: 35px;

            border-color: #00ff88;
        }

        .container::before {
            top: -1px;
            left: -1px;
            border-top: 3px solid;
            border-left: 3px solid;
        }

        .container::after {
            right: -1px;
            bottom: -1px;
            border-right: 3px solid;
            border-bottom: 3px solid;
        }

        /* ステータス */

        .status {
            color: #00ff88;
            font-size: 11px;
            letter-spacing: 4px;
            margin-bottom: 25px;
            text-shadow: 0 0 10px #00ff88;
        }

        .status::before {
            content: "● ";
            text-shadow: 0 0 10px #00ff88;
        }

        /* メッセージ */

        .message {
            margin: 0;
            color: #00ffff;
            font-size: clamp(17px, 3vw, 24px);
            line-height: 2;
            letter-spacing: 2px;
            text-shadow:
                0 0 5px #00ffff,
                0 0 15px rgba(0,255,255,0.5);
        }

        .sub-message {
            margin-top: 20px;
            color: #5daeb2;
            font-size: 11px;
            letter-spacing: 3px;
        }

        /* 点滅 */

        .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            margin-left: 5px;
            background: #00ffff;
            vertical-align: middle;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% {
                opacity: 1;
            }

            51%, 100% {
                opacity: 0;
            }
        }

        @media (max-width: 500px) {
            .container {
                padding: 45px 20px;
            }

            .message {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="status">
            SYSTEM MESSAGE
        </div>
        <p class="message">
            おっと、ここはもう何もないようだ。<br>
            次回をお楽しみに<span class="cursor"></span>
        </p>
        <div class="sub-message">
            // END OF TRANSMISSION
        </div>
    </main>
</body>
</html>
