<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONNECT LINK</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(rgba(0, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.04) 1px, transparent 1px),
                #05070a;

            background-size: 40px 40px;
            color: #00ffff;
            font-family: "Consolas", "Courier New", monospace;

            overflow: hidden;
        }

        /* 画面全体のスキャンライン */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;

            background: repeating-linear-gradient(
                0deg,
                rgba(255, 255, 255, 0.015),
                rgba(255, 255, 255, 0.015) 1px,
                transparent 1px,
                transparent 4px
            );
        }

        .container {
            width: min(90%, 600px);
            padding: 40px;

            background: rgba(5, 15, 20, 0.9);
            border: 1px solid #00ffff;

            box-shadow:
                0 0 10px #00ffff,
                inset 0 0 30px rgba(0, 255, 255, 0.08);

            position: relative;
        }

        /* コーナー装飾 */
        .container::before,
        .container::after {
            content: "";
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: #00ffff;
        }

        .container::before {
            top: -1px;
            left: -1px;
            border-top: 3px solid;
            border-left: 3px solid;
        }

        .container::after {
            right: -1px;
            bottom: -1px;
            border-right: 3px solid;
            border-bottom: 3px solid;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
            letter-spacing: 6px;

            text-shadow:
                0 0 5px #00ffff,
                0 0 20px #00ffff;
        }

        .header p {
            color: #6affff;
            font-size: 12px;
            letter-spacing: 3px;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 15px;

            background: #020506;
            color: #00ffff;

            border: 1px solid #00ffff;
            outline: none;

            font-family: inherit;
            font-size: 16px;

            box-shadow: inset 0 0 10px rgba(0, 255, 255, 0.1);
        }

        input::placeholder {
            color: #286b70;
        }

        input:focus {
            box-shadow:
                0 0 10px rgba(0, 255, 255, 0.5),
                inset 0 0 10px rgba(0, 255, 255, 0.1);
        }

        button {
            padding: 0 25px;

            background: transparent;
            color: #00ffff;

            border: 1px solid #00ffff;

            font-family: inherit;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #00ffff;
            color: #05070a;

            box-shadow:
                0 0 10px #00ffff,
                0 0 30px #00ffff;
        }

        button:active {
            transform: scale(0.96);
        }

        .status {
            margin-top: 20px;
            color: #3d8588;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .status::before {
            content: "● ";
            color: #00ff88;
            text-shadow: 0 0 8px #00ff88;
        }

        @media (max-width: 500px) {
            .container {
                padding: 25px;
            }

            .input-area {
                flex-direction: column;
            }

            button {
                padding: 14px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="header">
            <h1>CONNECT LINK</h1>
            <p>SECURE NAVIGATION SYSTEM</p>
        </div>

        <div class="input-area">
            <input
                type="text"
                id="text"
                placeholder="ENTER ACCESS CODE..."
                autocomplete="off"
            >

            <button onclick="go()">
                CONNECT
            </button>
        </div>

        <div class="status">
            SYSTEM ONLINE
        </div>

    </main>

    <script>
        function go() {
            const text = document.getElementById("text").value.trim();

            if (!text) {
                return;
            }

            window.location.href =
                "https://amagm0.github.io/Mystery/" + encodeURIComponent(text);
        }

        // Enterキーでも実行
        document.getElementById("text").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                go();
            }
        });
    </script>

</body>
</html>
