
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 // NOT FOUND</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(rgba(0, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.035) 1px, transparent 1px),
                #030609;

            background-size: 40px 40px;

            color: #00ffff;
            font-family: "Consolas", "Courier New", monospace;

            overflow: hidden;
        }

        /* スキャンライン */
        body::before {
            content: "";
            position: fixed;
            inset: 0;

            pointer-events: none;

            background: repeating-linear-gradient(
                0deg,
                rgba(255,255,255,0.015),
                rgba(255,255,255,0.015) 1px,
                transparent 1px,
                transparent 4px
            );
        }

        .container {
            width: min(90%, 650px);

            padding: 50px 40px;

            text-align: center;

            background: rgba(3, 12, 16, 0.92);

            border: 1px solid #00ffff;

            box-shadow:
                0 0 10px #00ffff,
                inset 0 0 40px rgba(0, 255, 255, 0.06);

            position: relative;
        }

        /* コーナー */
        .container::before,
        .container::after {
            content: "";

            position: absolute;

            width: 35px;
            height: 35px;

            border-color: #00ffff;
        }

        .container::before {
            top: -1px;
            left: -1px;

            border-top: 3px solid;
            border-left: 3px solid;
        }

        .container::after {
            right: -1px;
            bottom: -1px;

            border-right: 3px solid;
            border-bottom: 3px solid;
        }

        .code {
            font-size: clamp(80px, 18vw, 150px);

            font-weight: bold;
            line-height: 1;

            margin-bottom: 20px;

            text-shadow:
                0 0 5px #00ffff,
                0 0 20px #00ffff,
                0 0 50px rgba(0, 255, 255, 0.6);

            animation: glitch 2s infinite;
        }

        .title {
            font-size: 22px;

            letter-spacing: 5px;

            margin-bottom: 15px;
        }

        .message {
            color: #70bfc2;

            font-size: 13px;

            line-height: 1.8;

            margin-bottom: 30px;
        }

        .status {
            color: #00ff88;

            font-size: 11px;

            letter-spacing: 2px;

            margin-bottom: 25px;
        }

        .status::before {
            content: "● ";

            text-shadow: 0 0 10px #00ff88;
        }

        .home {
            display: inline-block;

            padding: 13px 25px;

            color: #00ffff;

            text-decoration: none;

            border: 1px solid #00ffff;

            transition: 0.2s;
        }

        .home:hover {
            background: #00ffff;

            color: #030609;

            box-shadow:
                0 0 10px #00ffff,
                0 0 30px #00ffff;
        }

        /* グリッチ */
        @keyframes glitch {
            0%, 90%, 100% {
                transform: translate(0);
            }

            92% {
                transform: translate(-3px, 2px);
            }

            94% {
                transform: translate(3px, -2px);
            }

            96% {
                transform: translate(-2px, 0);
            }
        }

        @media (max-width: 500px) {
            .container {
                padding: 40px 20px;
            }

            .title {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="code">ERROR!</div>

        <div class="title">
            THE CODE IS INCORRECT
        </div>

        <div class="message">
            This is not where you are supposed to be.<br>
            I wish you all the best.
        </div>

        <div class="status">
            SYSTEM ONLINE // CONNECTION STABLE
        </div>

        <a class="home" href="./">
            RETURN
        </a>

    </main>

</body>
</html>
