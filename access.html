<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ACCESS GRANTED</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(rgba(0,255,255,0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,255,0.035) 1px, transparent 1px),
                #030609;

            background-size: 40px 40px;

            color: #00ffff;
            font-family: "Consolas", "Courier New", monospace;

            overflow: hidden;
        }

        /* スキャンライン */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;

            background: repeating-linear-gradient(
                0deg,
                rgba(255,255,255,0.015),
                rgba(255,255,255,0.015) 1px,
                transparent 1px,
                transparent 4px
            );

            z-index: 100;
        }


        /* =========================
           Loading
        ========================= */

        #loading {
            width: min(90%, 600px);

            text-align: center;
        }

        .loading-title {
            color: #00ffff;

            font-size: clamp(30px, 7vw, 50px);

            letter-spacing: 6px;

            text-shadow:
                0 0 5px #00ffff,
                0 0 20px #00ffff,
                0 0 40px rgba(0,255,255,0.5);

            margin-bottom: 20px;
        }

        .loading-text {
            height: 20px;

            color: #5daeb2;

            font-size: 12px;

            letter-spacing: 2px;

            margin-bottom: 20px;
        }

        .progress-box {
            width: 100%;
            height: 12px;

            padding: 2px;

            border: 1px solid #00ffff;

            box-shadow:
                0 0 10px rgba(0,255,255,0.2);
        }

        .progress {
            width: 0%;
            height: 100%;

            background: #00ffff;

            box-shadow:
                0 0 10px #00ffff,
                0 0 25px #00ffff;

            transition: width 0.1s linear;
        }

        .percentage {
            margin-top: 12px;

            color: #00ffff;

            font-size: 12px;
        }


        /* =========================
           Success
        ========================= */

        #success {
            display: none;

            width: min(90%, 650px);

            padding: 45px 40px;

            text-align: center;

            background: rgba(3,15,18,0.94);

            border: 1px solid #00ff88;

            box-shadow:
                0 0 10px #00ff88,
                0 0 40px rgba(0,255,136,0.15),
                inset 0 0 40px rgba(0,255,136,0.05);

            position: relative;
        }

        /* コーナー */

        #success::before,
        #success::after {
            content: "";

            position: absolute;

            width: 35px;
            height: 35px;

            border-color: #00ff88;
        }

        #success::before {
            top: -1px;
            left: -1px;

            border-top: 3px solid;
            border-left: 3px solid;
        }

        #success::after {
            right: -1px;
            bottom: -1px;

            border-right: 3px solid;
            border-bottom: 3px solid;
        }

        .status {
            color: #00ff88;

            font-size: 11px;

            letter-spacing: 4px;

            margin-bottom: 15px;

            text-shadow: 0 0 10px #00ff88;
        }

        .title {
            margin: 0;

            color: #00ff88;

            font-size: clamp(40px, 9vw, 65px);

            line-height: 1.05;

            letter-spacing: 5px;

            text-shadow:
                0 0 5px #00ff88,
                0 0 20px #00ff88,
                0 0 50px rgba(0,255,136,0.5);

            animation: glitch 2s infinite;
        }

        .message {
            margin: 20px 0 35px;

            color: #7fcfc0;

            font-size: 12px;

            line-height: 1.8;
        }

        .gift-title {
            color: #00ffff;

            font-size: 12px;

            letter-spacing: 4px;

            margin-bottom: 12px;
        }

        .gift-code {
            padding: 18px;

            background: #020607;

            border: 1px solid #00ffff;

            color: #00ffff;

            font-size: clamp(16px, 4vw, 24px);

            letter-spacing: 3px;

            text-shadow: 0 0 10px #00ffff;

            box-shadow:
                inset 0 0 15px rgba(0,255,255,0.08),
                0 0 10px rgba(0,255,255,0.2);

            user-select: all;

            margin-bottom: 20px;
        }

        .copy-button {
            padding: 12px 25px;

            background: transparent;

            border: 1px solid #00ffff;

            color: #00ffff;

            font-family: inherit;

            cursor: pointer;

            transition: 0.2s;
        }

        .copy-button:hover {
            background: #00ffff;

            color: #030609;

            box-shadow:
                0 0 10px #00ffff,
                0 0 25px #00ffff;
        }


        /* =========================
           Animations
        ========================= */

        @keyframes glitch {
            0%, 90%, 100% {
                transform: translate(0);
            }

            92% {
                transform: translate(-3px, 2px);
            }

            94% {
                transform: translate(3px, -2px);
            }

            96% {
                transform: translate(-2px, 0);
            }
        }

        .flash {
            position: fixed;

            inset: 0;

            background: white;

            opacity: 0;

            pointer-events: none;

            z-index: 200;
        }

        .flash.active {
            animation: flash 0.4s ease-out;
        }

        @keyframes flash {
            0% {
                opacity: 0;
            }

            40% {
                opacity: 0.8;
            }

            100% {
                opacity: 0;
            }
        }


        @media (max-width: 500px) {
            #success {
                padding: 35px 20px;
            }
        }
    </style>
</head>

<body>


    <!-- Loading -->

    <div id="loading">

        <div class="loading-title">
            CONNECTING
        </div>

        <div class="loading-text" id="loadingText">
            INITIALIZING SECURE CONNECTION...
        </div>

        <div class="progress-box">
            <div class="progress" id="progress"></div>
        </div>

        <div class="percentage" id="percentage">
            0%
        </div>

    </div>


    <!-- アクセス成功 -->

    <main id="success">

        <div class="status">
            ● ACCESS VERIFIED
        </div>

        <h1 class="title">
            ACCESS<br>
            GRANTED
        </h1>

        <div class="message">
            AUTHENTICATION SUCCESSFUL.<br>
            THE REQUESTED RESOURCE HAS BEEN UNLOCKED.
        </div>

        <div class="gift-title">
            // GIFT CODE
        </div>

        <div class="gift-code" id="giftCode">
            XXXXX-XXXXX-XXXXX
        </div>

        <button class="copy-button" onclick="copyCode()">
            COPY CODE
        </button>

    </main>


    <!-- フラッシュ -->

    <div class="flash" id="flash"></div>


    <script>

        window.addEventListener("load", () => {

            const progress =
                document.getElementById("progress");

            const percentage =
                document.getElementById("percentage");

            const loadingText =
                document.getElementById("loadingText");

            const messages = [
                "INITIALIZING SECURE CONNECTION...",
                "ESTABLISHING ENCRYPTED CHANNEL...",
                "VERIFYING ACCESS...",
                "DECRYPTING RESOURCE...",
                "ACCESS VERIFIED...",
                "LOADING GIFT DATA..."
            ];

            let value = 0;

            const timer = setInterval(() => {

                // 少しランダムな速度で進む

                value += Math.floor(Math.random() * 5) + 2;

                if (value > 100) {
                    value = 100;
                }

                progress.style.width =
                    value + "%";

                percentage.textContent =
                    value + "%";


                const index = Math.min(
                    Math.floor(value / 17),
                    messages.length - 1
                );

                loadingText.textContent =
                    messages[index];


                if (value >= 100) {

                    clearInterval(timer);

                    setTimeout(showSuccess, 500);
                }

            }, 100);

        });


        function showSuccess() {

            const loading =
                document.getElementById("loading");

            const success =
                document.getElementById("success");

            const flash =
                document.getElementById("flash");


            // 画面フラッシュ

            flash.classList.add("active");


            setTimeout(() => {

                loading.style.display = "none";

                success.style.display = "block";

            }, 180);


            setTimeout(() => {

                flash.classList.remove("active");

            }, 500);

        }


        function copyCode() {

            const code =
                document
                    .getElementById("giftCode")
                    .textContent
                    .trim();

            navigator.clipboard.writeText(code)
                .then(() => {

                    const button =
                        document.querySelector(".copy-button");

                    button.textContent = "COPIED";

                    setTimeout(() => {

                        button.textContent = "COPY CODE";

                    }, 1500);

                });

        }

    </script>

</body>
</html>
